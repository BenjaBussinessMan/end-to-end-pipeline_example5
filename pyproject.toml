[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse"
version = "0.1.0"
description = "End-to-end enterprise lakehouse (Medallion) on Databricks"
requires-python = ">=3.10"
dependencies = []  # pyspark / delta come from the Databricks runtime

[project.optional-dependencies]
dev = ["pyspark>=3.5,<4", "delta-spark>=3.1,<4", "pytest>=8", "ruff>=0.5", "build"]

[project.scripts]
bronze = "lakehouse.bronze.ingest_transactions:main"
silver_dims = "lakehouse.silver.dims:main"
silver_transactions = "lakehouse.silver.clean_transactions:main"
gold = "lakehouse.gold.build_marts:main"
dq_gate = "lakehouse.governance.dq_checks:main"
benchmark = "lakehouse.optimization.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
